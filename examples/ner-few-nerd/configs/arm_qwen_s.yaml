# qwen small — eval-qwen-flash. Few-NERD named-entity recognition.
#
# Same alias, price and reasoning settings as this arm in the other three examples, so a
# difference between them is the TASK and not the configuration.
#
# max_tokens 600, not the 200 the classification examples use: the answer is a JSON array
# of ~2.7 objects, not one word. An arm cut off mid-array produces unparseable output and
# scores 0 for that ITEM — which would read as a model that cannot do NER rather than a
# budget that was too small. `truncated` and `parsed` are both recorded per item.
#
# n=56 is the DEV slice, a seeded-random sample of sentences (no class to stratify on —
# a sentence carries several entities of several types). Its job here is to catch an arm
# that cannot hold the JSON contract, which is a property of the model, not the items.
# The claim is made on the 224 items it does not contain.
config_id: fn_qwen_s_v1
dataset_id: few_nerd_56
adapter: ../adapter.py
params:
  provider: litellm
  model: eval-qwen-flash
  family: qwen
  price_tier: small
  temperature: 0.0
  prompt_file: prompt.txt
  reasoning:
    enabled: false
  max_tokens: 600
  usd_per_mtok_in: 0.05
  usd_per_mtok_out: 0.2
