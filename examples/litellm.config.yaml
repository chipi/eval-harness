# A LiteLLM proxy config serving every alias the example configs use.
# Generated from models.json (the self-test checks they agree); edit that, not this.
#
#   pip install "litellm[proxy]"
#   OPENROUTER_API_KEY=sk-or-... litellm --config examples/litellm.config.yaml --port 4001
#
# then in harness/.env:  LITELLM_BASE_URL=http://127.0.0.1:4001  and  LITELLM_API_KEY=<any non-empty string>
# Without a proxy you need none of this: OPENROUTER_API_KEY alone takes the direct route.
model_list:
  - model_name: eval-claude-haiku
    litellm_params:
      model: openrouter/anthropic/claude-haiku-4.5
      api_key: os.environ/OPENROUTER_API_KEY
