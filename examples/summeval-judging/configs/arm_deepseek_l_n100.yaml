# The deepseek_l judge on SummEval. Same model, tier, price and settings as the arm of the
# same name in every other experiment here; only the task differs. It reads the article
# and the 16 summaries (never the human references) and returns 1-5 scores per summary on
# four dimensions as JSON (../prompt.txt, sha in the fingerprint). max_tokens 1500 covers
# 64 numbers with room; `truncated` records any reply that hit it anyway.
config_id: se_deepseek_l_n100_v1
dataset_id: summeval_100
adapter: ../adapter.py
params:
  provider: litellm
  model: eval-deepseek-pro
  family: deepseek
  price_tier: large
  temperature: 0.0
  reasoning:
    enabled: false
  usd_per_mtok_in: 0.28
  usd_per_mtok_out: 1.1
  prompt_file: prompt.txt
  max_tokens: 1500
goal: summary_judge_summeval
