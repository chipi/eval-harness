# A replacement for qwen_l, NOT the same arm. qwen_l's model (qwen/qwen3-max) was retired
# by OpenRouter on 2026-10-09, after the other five experiments measured it, so the
# SummEval run of arm_qwen_l_n100 failed at warm-up (404) and billed nothing. Qwen's
# current flagship, qwen/qwen3.8-max-0902, refuses reasoning disabled ("Reasoning is
# mandatory for this endpoint"), which this field's protocol does not allow. This arm is
# the previous flagship, qwen/qwen3.7-max, which accepts reasoning off (tested 2026-10-18:
# 0 reasoning tokens), at $1.475/$4.425 per Mtok (OpenRouter, read 2026-10-18). It has its
# own config_id so it can never be read as the qwen_l of the other experiments. Prompt,
# max_tokens and settings are otherwise the qwen_l judge's.
config_id: se_qwen37max_n100_v1
dataset_id: summeval_100
adapter: ../adapter.py
params:
  provider: litellm
  model: eval-qwen-37max
  family: qwen
  price_tier: large
  temperature: 0.0
  reasoning:
    enabled: false
  usd_per_mtok_in: 1.475
  usd_per_mtok_out: 4.425
  prompt_file: prompt.txt
  max_tokens: 1500
goal: summary_judge_summeval
