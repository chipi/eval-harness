# The gemma_s judge on SummEval. Same model, tier, price and settings as the arm of the
# same name in every other eval here; only the task differs. It reads the article
# and the 16 summaries (never the human references) and returns 1-5 scores per summary on
# four dimensions as JSON (../prompt.txt, sha in the fingerprint). max_tokens 1500 covers
# 64 numbers with room; `truncated` records any reply that hit it anyway.
system_id: se_gemma_s_n100_v1
adapter: ../adapter.py
params:
  provider: litellm
  model: eval-gemma-3-27b
  family: gemma
  price_tier: small
  temperature: 0.0
  reasoning:
    enabled: false
  usd_per_mtok_in: 0.07
  usd_per_mtok_out: 0.15
  prompt_file: prompt.txt
  max_tokens: 1500
