# The open-weight gpt-oss:120b, hosted (OpenRouter): the twin of the self-hosted Ollama arms of the same weights.
# Arms differ only in the model: the fleet's prompt, probes and gates are the same for every arm.
system_id: triage_hosted_gpt_oss_120b_v1
adapter: ../adapter.py
params:
  provider: gateway
  model: eval-gpt-oss-120b
  usd_per_mtok_in: 0.15
  usd_per_mtok_out: 0.6
