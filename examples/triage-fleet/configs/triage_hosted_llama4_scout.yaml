# The open-weight llama4:scout, hosted (OpenRouter): the twin of the self-hosted Ollama arms of the same weights.
# Arms differ only in the model: the fleet's prompt, probes and gates are the same for every arm.
config_id: triage_hosted_llama4_scout_v1
dataset_id: orrery_triage_v1_labelled
adapter: ../adapter.py
goal: triage_orrery
params:
  provider: gateway
  model: eval-llama-scout
  usd_per_mtok_in: 0.1
  usd_per_mtok_out: 0.3
