  model: "gemma4:12b"
  url: http://127.0.0.1:11434/v1/chat/completions
  reasoning_effort: none
  max_tokens: 1024
  call_timeout_s: 30
  machine: x3
  usd_per_mtok_in: 0
  usd_per_mtok_out: 0
