# bge-small-en-v1.5 — 33M parameters, and unlike MiniLM it is trained FOR retrieval, with
# an asymmetric query instruction and no document prefix.
#
# THE QUERY PREFIX IS NOT DECORATION. BGE is trained with this exact instruction on the
# query side; omitting it costs several nDCG points and produces no error, which is the
# silent-misconfiguration class this repo fingerprints against. It is recorded in the
# fingerprint and keyed into the index cache.
#
# The pair (minilm, bge_small) isolates TRAINING OBJECTIVE at roughly equal size, the way
# (gliner, span_marker) isolated task-specific training in the NER example.
config_id: sf_bge_small_v1
dataset_id: scifact_40
adapter: ../adapter.py
params:
  provider: dense
  model: BAAI/bge-small-en-v1.5
  corpus_id: scifact
  family: bge
  price_tier: free
  device: cpu
  precision: fp32
  encode_batch: 64
  top_k: 100
  query_prefix: "Represent this sentence for searching relevant passages: "
  doc_prefix: ""
