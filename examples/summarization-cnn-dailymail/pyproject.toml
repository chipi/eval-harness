# This example's OWN dependency chain and its OWN interpreter.
#
# The harness core runs on whatever Python you have and needs pyyaml + openai. This
# example needs torch, transformers and rouge-score — and a newer Python than the harness
# venv happens to have (3.9). A requirements.txt cannot express the second half of that,
# which is why this is a uv project: `requires-python` is a constraint uv SATISFIES by
# provisioning an interpreter, not a wish it checks.
#
# uv.lock beside this file is the other half. The run fingerprint RECORDS the versions
# that produced a number; the lock makes them RECOVERABLE. Recording without locking
# leaves a result attributable but not reproducible, which is half a job.
[project]
name = "eval-example-summarization-cnn-dailymail"
version = "0.1.0"
description = "ML vs LLM summarisation on CNN/DailyMail, through the eval harness"
requires-python = ">=3.11"
dependencies = [
    # The harness core's own needs, because the harness scripts run in THIS environment.
    "pyyaml>=6.0",
    "openai>=1.0",
    # ROUGE: the implementation the papers use, so our numbers are comparable to theirs.
    # A hand-rolled ROUGE would tokenise and stem differently and quietly stop being
    # comparable to anything published — which is the whole reason for a standard dataset.
    "rouge-score>=0.1.2",
]

[project.optional-dependencies]
# The LOCAL arm only. An LLM-only sweep never installs torch:
#     uv sync                 -> LLM arms
#     uv sync --extra local   -> adds the local ML arm
# Kept optional because "you must download 2GB of torch to evaluate an API model" is
# exactly the coupling the adapter's lazy imports exist to avoid.
local = [
    # PyTorch stopped publishing Intel-Mac wheels after 2.2.2. An unconstrained resolve
    # picks the newest release and fails at INSTALL time with "doesn't have a source
    # distribution or wheel for the current platform" — so the ceiling is declared here,
    # as a marker, rather than discovered by whoever next runs `uv sync --extra local`.
    # Every other platform keeps a current torch; the cap is this machine's, not the
    # example's.
    "torch>=2.2,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # Two separate ceilings, both caused by the torch 2.2.2 cap above:
    #
    #   transformers 5.x  does not recognise torch 2.2 at all. It installs, imports, and
    #                     prints "PyTorch was not found. Models won't be available" -- then
    #                     fails at model load, not at install. A silent backend downgrade
    #                     is worse than a resolver error.
    "transformers>=4.40,<4.56",
    #
    # A NOTE ON WHAT THIS CAP DOES NOT BUY, because an earlier version of this comment
    # claimed it did. `research/HANDOVER.md` records the pickle restriction as arriving in
    # transformers 4.56; it is present in 4.55.4, and pinning below 4.56 does NOT unblock
    # .bin-only checkpoints:
    #
    #   ValueError: Due to a serious vulnerability issue in `torch.load`, even with
    #   `weights_only=True`, we now require users to upgrade torch to at least v2.6 ...
    #   This version restriction does not apply when loading files with safetensors.
    #   CVE-2025-32434
    #
    # torch >= 2.6 has no x86_64 macOS wheel, so on THIS machine the rule reduces to: a
    # checkpoint without safetensors cannot be loaded, full stop. bart-large-cnn ships
    # safetensors and runs. distilbart-cnn-12-6, distilbart-cnn-6-6, bart-large-xsum,
    # pegasus-cnn_dailymail and pegasus-xsum are all .bin-only and do not.
    #
    # Getting them requires either a machine that can take torch >= 2.6, or deliberately
    # stepping around a CVE guard to execute third-party pickles. That is a decision to
    # take in the open, not a dependency pin to make quietly, so nothing here takes it.
    # Third ceiling, same root cause. torch 2.2.2 was built against the NumPy 1.x C API;
    # with NumPy 2 installed it imports, warns "Failed to initialize NumPy: _ARRAY_API not
    # found", and every tensor->array conversion raises "Numpy is not available". Scoped to
    # the same platform as the torch cap so no other machine inherits a two-year-old NumPy.
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.uv]
# No build backend needed: this is a set of scripts, not a distributable package.
package = false
