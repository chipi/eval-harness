# cnn_lead3 on the DAILYMAIL slice — identical to arm_lead3_n200.yaml except the dataset.
#
# WHY: the committed cnn_dailymail_200 slice is the first 200 rows of the test split,
# which are all CNN (196 with CNN's dateline, 4 partner pieces); the split is ~91%
# DailyMail. This slice is 200
# DailyMail articles drawn at random (seed 20261014) from the same test split, so the
# question "do the summarisation conclusions hold outside CNN?" has data. Same params,
# same prompt, same scorer; read alongside, never pooled with, the CNN slice. Full
# rationale: examples/summarization-cnn-dailymail/fetch.py and REPORT_SUMMARIZATION.md.
config_id: cnn_lead3_dm200_v1
dataset_id: cnn_dailymail_dm200
adapter: ../adapter.py
params:
  provider: lead_k
  # Three, because that is the number the CNN/DailyMail literature reports as LEAD-3, and
  # a floor whose parameter we tuned is not a floor. It is not chosen to flatter or to
  # embarrass the other arms; it is chosen because it is the published convention.
  sentences: 3
  family: lead
  price_tier: free
goal: news_summary_cnn
