# deepseek small — eval-deepseek-flash. AG News topic classification.
#
# Alias, price and reasoning settings are taken from the summarisation example's arm of
# the same name, so a difference between the two examples is the TASK and not the
# configuration. Why 24 arms, why temperature 0, and why max_tokens 200 for a one-word
# answer are all in ../README.md.
#
# max_tokens 200 is not a typo for a task whose answer is one word. Reasoning models spend
# thinking tokens INSIDE the output budget, so a tight cap does not buy terseness, it buys
# a truncated answer that scores like a bad model. `truncated` is recorded per item.
#
# n=20 is the DEV slice. Prompt and parser may be tuned against it; the claim is made on
# the 180 items of ag_news_200 that it does not contain — `make holdout DATASET_ID=
# ag_news_200 EXCLUDE=ag_news_20`. Tuning on the set you then report is the winner's curse,
# and the summarisation study watched a 0.0737 lead become 0.00008 that way.
config_id: ag_deepseek_s_v1
dataset_id: ag_news_20
adapter: ../adapter.py
params:
  provider: litellm
  model: eval-deepseek-flash
  family: deepseek
  price_tier: small
  temperature: 0.0
  prompt_file: prompt.txt
  reasoning:
    enabled: false
  max_tokens: 200
  usd_per_mtok_in: 0.1
  usd_per_mtok_out: 0.4
