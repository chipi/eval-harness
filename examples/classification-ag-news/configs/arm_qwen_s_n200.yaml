# qwen small — eval-qwen-flash. AG News topic classification.
#
# Alias, price and reasoning settings are taken from the summarisation example's arm of
# the same name, so a difference between the two examples is the TASK and not the
# configuration. Why 24 arms, why temperature 0, and why max_tokens 200 for a one-word
# answer are all in ../README.md.
#
# max_tokens 200 is not a typo for a task whose answer is one word. Reasoning models spend
# thinking tokens INSIDE the output budget, so a tight cap does not buy terseness, it buys
# a truncated answer that scores like a bad model. `truncated` is recorded per item.
#
# The measurement slice. ONLY config_id and dataset_id differ from arm_qwen_s.yaml, so a
# delta against the dev run is attributable to n and nothing else. Every one of the 24
# hosted arms is run here — none is selected on its dev score, because selecting on n=20
# and reporting on n=200 is exactly the bias this repo exists to catch, and at roughly
# $0.02 an arm the selection would save nothing.
config_id: ag_qwen_s_n200_v1
dataset_id: ag_news_200
adapter: ../adapter.py
params:
  provider: litellm
  model: eval-qwen-flash
  family: qwen
  price_tier: small
  temperature: 0.0
  prompt_file: prompt.txt
  reasoning:
    enabled: false
  max_tokens: 200
  usd_per_mtok_in: 0.05
  usd_per_mtok_out: 0.2
