# The `evals` stack on the prod VPS: the harness site, the catalog, and the run inspector of
# this repository's example experiments. Lives at /srv/evals/current/compose.yml on the box
# (infra/deploy/deploy.sh). Shares nothing with the other tenants: own compose project, own
# containers, own loopback ports (127.0.0.1:8096 nginx, 127.0.0.1:8097 inspector, 127.0.0.1:8098 mcp),
# own files.
# The only public entry is the shared Caddy edge (infra/caddy/). Template: chipi/humancopilot.eu
# infra/compose.yml (the prod session's hardening, unchanged).
name: evals

services:
  nginx:
    # Static pages: evals.humancopilot.eu (site/public) and evals.humancopilot.eu/catalog (the
    # built catalog). nginx-unprivileged stable line, pinned by digest; bump tag and digest together.
    image: nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:782bb89768cc87b7f95c18b95baa1af250e5d451f26794f59363540161147c01
    container_name: evals-nginx
    # The deployed release (sha-<7>, rendered by render.sh): Alloy copies it into each log line's
    # `release` field (LOG-STANDARD), the same value as GlitchTip's release and the traces'
    # service.version.
    labels:
      release: __RELEASE__
    # Bypass the image's entrypoint scripts: they try to rewrite /etc/nginx on a read-only root.
    # The config path goes through the `current` symlink, so a reload picks up a new release.
    entrypoint: ["nginx", "-c", "/srv/evals/current/nginx/nginx.conf", "-g", "daemon off;"]
    ports:
      - "127.0.0.1:${EVALS_PORT:-8096}:8080"
    volumes:
      - /srv/evals:/srv/evals:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,nr_inodes=4096,uid=101,gid=101,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  inspector:
    # The run inspector's API (/catalog/api/* on evals.humancopilot.eu): the harness's own
    # catalog_serve.py in --public mode. The stock Python image runs the release's copy of the
    # package (installed from its wheel by render.sh, with PyYAML's pure-Python package beside it
    # for the goals) from the read-only mount: nothing is built or installed on the box.
    # It reads the release's copy of the runs and references; it calls out to nothing.
    image: python:3.12.14-alpine3.23@sha256:d339953547bb5bc57eb5c1ff3224c40890ce56e494b13a52a574658e5a0f888a
    container_name: evals-inspector
    user: "65534:65534"
    # deploy's group (gid 1001 on the VPS): /srv/evals/observability.env is deploy:deploy, mode 640,
    # rendered by the deploy workflow, so the inspector can read it and no other account on the box
    # can. Inside the container the group reaches only what is mounted: /srv/evals, read-only.
    group_add: ["1001"]
    working_dir: /srv/evals/current/inspector
    environment:
      EVAL_HOME: /srv/evals/current/inspector
      EVAL_BUILD_REF: deployed
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      # The observability SDKs render.sh vendored for hooks.py (not the harness's dependencies).
      PYTHONPATH: /srv/evals/current/inspector/vendor
    # ADR-0010 (agentic-ai-homelab): the identity every collector copies.
    labels:
      telemetry.service: evals-inspector
      telemetry.namespace: evals
      telemetry.environment: prod
      # As on evals-nginx: the release into each log line's `release` field.
      release: __RELEASE__
    command:
      - python
      - /srv/evals/current/inspector/pkg/evaluation_harness/catalog_serve.py
      - --public
      - evals.humancopilot.eu
      - --bind
      - 0.0.0.0
      - --port
      - "8080"
      - --rate
      - "60"
      # X-Real-IP: the visitor's address as Caddy resolved it (evals.caddy: CF-Connecting-IP, from
      # Cloudflare's ranges only; Hetzner's firewall lets only Cloudflare reach :443).
      - --client-header
      - X-Real-IP
      # The example runs' outputs are already public in the repository; their gold references
      # are not committed, and are not published.
      - --publish
      - outputs
      - --warm
      - /srv/evals/current/sites/evals.humancopilot.eu/public/catalog
      # This deployment's observability (infra/inspector/hooks.py): errors to GlitchTip, a span
      # per request, /metrics on the loopback port. Settings in /srv/evals/observability.env.
      - --hooks
      - /srv/evals/current/inspector/hooks.py
    ports:
      - "127.0.0.1:${INSPECTOR_PORT:-8097}:8080"
    volumes:
      - /srv/evals:/srv/evals:ro
    read_only: true
    tmpfs:
      # nr_inodes: size bounds bytes, not files (16 MB held 100,000 empty files at ~1 KB of memory each)
      - /tmp:size=16m,nr_inodes=4096,uid=65534,gid=65534,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8080/api/health', headers={'Host': 'evals.humancopilot.eu'}), timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  mcp:
    # The harness's MCP server (evals.humancopilot.eu/mcp, RFC-018): the project's read commands as
    # tools for any agent, over Streamable HTTP, stateless. Read-only by construction: its tools are
    # the commands that only read (no tool writes, spends or runs a model), --public leaves out the
    # options that answer with an item's text, and it reads the release's public copy of the data
    # from the read-only mount. No authentication: anyone may read what the site and the catalog
    # already publish. The same stock image and package as the inspector; the MCP SDK and its
    # dependencies vendored beside it by render.sh (inspector/mcpvendor).
    image: python:3.12.14-alpine3.23@sha256:d339953547bb5bc57eb5c1ff3224c40890ce56e494b13a52a574658e5a0f888a
    container_name: evals-mcp
    user: "65534:65534"
    group_add: ["1001"]
    working_dir: /srv/evals/current/inspector
    environment:
      EVAL_HOME: /srv/evals/current/inspector
      EVAL_BUILD_REF: deployed
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /srv/evals/current/inspector/pkg:/srv/evals/current/inspector/mcpvendor:/srv/evals/current/inspector/vendor
      # The goals' tests, precomputed by render.sh: each tool call is a fresh process.
      EVH_P_CACHE: /srv/evals/current/inspector/cache/evh-p.jsonl
    labels:
      telemetry.service: evals-mcp
      telemetry.namespace: evals
      telemetry.environment: prod
      release: __RELEASE__
    command:
      - python
      - /srv/evals/current/inspector/pkg/evaluation_harness/mcp_server.py
      - --http
      - --public
      - --bind
      - 0.0.0.0
      - --port
      - "8080"
      - --allowed-host
      - evals.humancopilot.eu
      - --allowed-origin
      - https://evals.humancopilot.eu
      # As for the inspector: the address Caddy resolved (evals.caddy).
      - --client-header
      - X-Real-IP
      # The throttling is the server's own: nothing in front of it rate-limits (Cloudflare only
      # proxies). Per caller, and for everyone together: a caller who rotates the header it is
      # named by (or reaches the box past Cloudflare) is still held by the total.
      - --rate
      - "30"
      - --rate-total
      - "120"
      # Every HTTP request to /mcp, per caller, before the body is read: ping and tools/list
      # floods never reach the tool calls' rate (a call is about three requests).
      - --request-rate
      - "300"
      - --max-body
      - "65536"
      - --max-connections
      - "64"
      # Two commands at once at most: each is a process of up to ~60 MB, inside mem_limit.
      - --concurrent
      - "2"
      - --timeout
      - "60"
      - --hooks
      - /srv/evals/current/inspector/mcp_hooks.py
    ports:
      - "127.0.0.1:${MCP_PORT:-8098}:8080"
    volumes:
      - /srv/evals:/srv/evals:ro
    read_only: true
    tmpfs:
      # nr_inodes: size bounds bytes, not files (16 MB held 100,000 empty files at ~1 KB of memory each)
      - /tmp:size=16m,nr_inodes=4096,uid=65534,gid=65534,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # A hard limit (the box has no swap and a nightly pipeline): the server and two commands.
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8080/mcp/health', headers={'Host': 'evals.humancopilot.eu'}), timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
