# Headers the Caddy edge's `hardened` snippet does not set. HSTS, X-Frame-Options,
# X-Content-Type-Options and Referrer-Policy come from Caddy; don't duplicate them here.
# __CSP_REPORT__ is rendered at deploy time to "report-uri <GlitchTip security endpoint>;" or to
# nothing when no project is configured (infra/deploy/render.sh, from infra/sites/<domain>.cfg).
# No 'unsafe-inline' anywhere: site/csp.py moves every inline script and style into files.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.humancopilot.eu https://static.cloudflareinsights.com; connect-src 'self' https://analytics.humancopilot.eu https://cloudflareinsights.com; img-src 'self' data:; style-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'; __CSP_REPORT__" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
