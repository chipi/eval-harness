# The catalog and the run inspector: no analytics, so only 'self'. The inspector page calls
# /api/* on its own origin (Caddy routes it to the evals-inspector container), which
# connect-src 'self' covers. __CSP_REPORT__ as in evals.humancopilot.eu-headers.conf.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'; __CSP_REPORT__" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
