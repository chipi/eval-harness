# The catalog and the run inspector: 'self', and this deployment's analytics (render.sh puts the
# site's Umami tag in the catalog's head; Cloudflare's beacon as on the site). The inspector page calls
# /catalog/api/* on its own origin (Caddy routes it to the evals-inspector container), which
# connect-src 'self' covers. __CSP_REPORT__ as in evals.humancopilot.eu-headers.conf.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.humancopilot.eu https://static.cloudflareinsights.com; connect-src 'self' https://analytics.humancopilot.eu https://cloudflareinsights.com; img-src 'self' data:; style-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'; __CSP_REPORT__" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
