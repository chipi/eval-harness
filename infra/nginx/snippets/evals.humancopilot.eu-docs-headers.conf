# The documentation (mkdocs Material): its theme runs inline scripts and sets inline styles, so
# this policy allows 'unsafe-inline' for scripts and styles, here only; GitHub Pages served the
# docs with no policy at all. Analytics as the site's. __CSP_REPORT__ as in
# evals.humancopilot.eu-headers.conf.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://analytics.humancopilot.eu https://static.cloudflareinsights.com; connect-src 'self' https://analytics.humancopilot.eu https://cloudflareinsights.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'; __CSP_REPORT__" always;
