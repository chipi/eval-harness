# evals.humancopilot.eu: the findings site (site/public, built and committed by `make site`).
# URLs keep their .html, as on GitHub Pages, so every existing link still resolves.
server {
  listen 8080;
  server_name evals.humancopilot.eu;
  root __RELEASE_DIR__/sites/evals.humancopilot.eu/public;

  # The documentation moved to its own host: every old /docs/... link lands on the same page
  # there. Here rather than in Caddy, so it ships, rolls back and is health-checked with the release.
  location = /docs { return 301 https://docs.evals.humancopilot.eu/; }
  location /docs/ {
    rewrite ^/docs/(.*)$ https://docs.evals.humancopilot.eu/$1 permanent;
  }

  # nginx drops server-level add_header in any location that sets its own, so every location
  # includes the header snippet explicitly.
  location / {
    try_files $uri $uri/index.html =404;
    include __RELEASE_DIR__/nginx/snippets/evals.humancopilot.eu-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
  location = /favicon.ico {
    try_files /assets/icon-32.png =404;
    include __RELEASE_DIR__/nginx/snippets/evals.humancopilot.eu-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
  }
  # Asset references carry ?v=<release sha> (render.sh), so a release's HTML never pairs with
  # another release's CSS or JS; the files themselves are not fingerprinted.
  location /assets/ {
    include __RELEASE_DIR__/nginx/snippets/evals.humancopilot.eu-headers.conf;
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    include __RELEASE_DIR__/nginx/snippets/evals.humancopilot.eu-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
}
