# catalog.evals.humancopilot.eu: the catalog of this repository's example experiments (built by
# `evh catalog` in the deploy workflow). /api/* never reaches nginx: the Caddy edge sends it to
# the evals-inspector container (infra/caddy/catalog.caddy).
server {
  listen 8080;
  server_name catalog.evals.humancopilot.eu;
  root __RELEASE_DIR__/sites/catalog.evals.humancopilot.eu/public;

  location / {
    try_files $uri $uri/index.html =404;
    include __RELEASE_DIR__/nginx/snippets/catalog.evals.humancopilot.eu-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
  location /assets/ {
    include __RELEASE_DIR__/nginx/snippets/catalog.evals.humancopilot.eu-headers.conf;
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
  }
}
