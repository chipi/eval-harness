# Static pages for every site in sites/<domain>/public (the findings site, the catalog). Runs unprivileged
# (nginx-unprivileged image: uid 101, listens on 8080 inside the container) behind the VPS's
# shared Caddy edge, which terminates TLS. Per-site server blocks live in sites/*.conf.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  types { application/manifest+json webmanifest; }

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  charset utf-8;

  # Caddy is the only client (127.0.0.1 → container bridge). It sets X-Real-IP to the visitor's
  # address as it resolved it (CF-Connecting-IP, taken only from Cloudflare's ranges; the edge's
  # :443 accepts only Cloudflare too). Trusted only from the Docker bridge range; on-box health
  # checks carry no header and keep the bridge address.
  set_real_ip_from 172.16.0.0/12;
  real_ip_header X-Real-IP;

  # Per visitor (the real address, above): nothing in front of us throttles. Generous for a person
  # (a catalog page and its assets are ~20 requests; the burst covers a few at once), a bound on a
  # bot hammering one site past the container's 0.5 CPU (an independent review, 2026-10-29).
  limit_req_zone $binary_remote_addr zone=per_visitor:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=visitor_conns:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # One JSON line per request to stdout; the node Alloy ships it (infra/observability/evals.alloy).
  # VictoriaLogs takes the message only from a key named `_msg` (the shared sink sets no _msg_field).
  log_format site_json escape=json
    '{"_msg":"$request_method $request_uri $status","time":"$time_iso8601","host":"$host","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
    '"duration":$request_time,"referer":"$http_referer","ua":"$http_user_agent",'
    '"client":"$remote_addr"}';
  access_log /dev/stdout site_json;

  # Temp paths writable by the unprivileged user on a read-only root filesystem.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Compression is done once, at the Caddy edge (`encode zstd gzip` in its `hardened` snippet).
  gzip off;

  # Unknown Host → close the connection. Only the sites below are served. Not logged: every
  # logged Host becomes a `site` stream label in VictoriaLogs (evals.alloy), so arbitrary Host
  # headers must never reach the log.
  server {
    listen 8080 default_server;
    access_log off;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { return 444; }
  }

  include __RELEASE_DIR__/nginx/sites/*.conf;
}
