# The stranger's path, on a clean machine, on every change.
#
#   verify     level 0 of docs/REPRODUCE.md: `make verify` from a fresh checkout -- every
#              number in every report recomputed from the committed runs, the site rebuilt
#              and compared, every link and model fact checked.
#   rerun      levels 1-2 for the arms that need no key and no PyTorch: fetch the public
#              data, hash-check it against the frozen datasets, rerun the deterministic
#              arms, and require the replication card to say they match the committed runs
#              exactly. A change that breaks a fetcher, a scorer, the data upstream or the
#              reproduce tooling turns this red before a stranger finds it.
#   browser    the catalog, the run inspector and the public site in headless Chromium, as a reader uses
#              them (harness/scripts/test_inspector_browser.py, site/test_browser.py): a tutorial project built from
#              the package's wheel and the site served with production's headers, any console error or
#              CSP violation a failure. The same make targets a developer runs.
#
# No secrets: nothing here calls a paid model, so it is safe on pull requests from forks.
name: reproduce

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproduce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: harness/requirements.txt
      - name: make verify
        run: make verify

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            harness/requirements.txt
            harness/requirements-browser.txt
      - name: harness environment
        run: make -C harness install
      - name: Playwright and Chromium (with the system libraries it needs)
        run: make -C harness browser-install ARGS=--with-deps
      - name: make browser-check
        run: make browser-check

  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - exp: summarization
            arms: lead3
          - exp: ag-news
            arms: keyword,constant
          - exp: scifact
            arms: bm25,random,first_k
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: harness/requirements.txt
      - uses: astral-sh/setup-uv@v6
      - name: harness environment
        run: make setup
      - name: data (fetch + hash check)
        run: harness/.venv/bin/python examples/reproduce.py data ${{ matrix.exp }} --light
      - name: rerun
        run: harness/.venv/bin/python examples/reproduce.py run ${{ matrix.exp }} --arms ${{ matrix.arms }}
      - name: replication card
        run: |
          harness/.venv/bin/python examples/reproduce.py compare ${{ matrix.exp }} | tee card.md
          ! grep -E '\| (within noise|consistent|DIFFERS|PARTIAL)' card.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replication-${{ matrix.exp }}
          path: harness/data/runs-repro/${{ matrix.exp }}/REPLICATION.md
