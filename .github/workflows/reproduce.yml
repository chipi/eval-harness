# The stranger's path, on a clean machine, on every change.
#
#   verify     level 0 of docs/REPRODUCE.md: `make verify` from a fresh checkout -- every
#              number in every report recomputed from the committed runs, every link and model
#              fact checked (make -C harness check).
#   site       the rest of `make verify`, beside it: the site rebuilt and compared (site-check).
#   (levels 1-2, which fetch the public data from Hugging Face, run in rerun.yml: an outage there
#    must not hold back a deploy or a release, which wait on this workflow)
#   commands   the report tools and the operational commands as a user runs them, on data where the
#              answer is known (harness/tests/test_report_tools.py, test_ops_commands.py): a few
#              minutes, so beside verify rather than in it.
#   browser    the catalog, the run inspector and the public site in headless Chromium, as a reader uses
#              them (harness/tests/test_inspector_browser.py, site/test_browser.py): a tutorial project built from
#              the package's wheel and the site served with production's headers, any console error or
#              CSP violation a failure. The same make targets a developer runs.
#   budget     the run inspector's budgets on this repository's runs (harness/tests/test_inspector_budget.py):
#              its memory under --warm below 200 MB (prod's container has 256 MiB; the 0.4.0
#              inspector peaked at 260 MB and was OOM-killed every ~5 minutes), a cached answer in
#              milliseconds, a cold one in seconds; then the same with this deployment's hooks and
#              their SDKs (infra/inspector/), as prod runs it. Then the pages of that same catalog
#              in Chromium (harness/tests/test_catalog_real_browser.py): hundreds of arms, not a
#              tutorial's three.
#
# No secrets: nothing here calls a paid model, so it is safe on pull requests from forks.
name: reproduce

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproduce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tested:
    # A push to main skips the jobs below when this workflow already passed on this exact tree, on
    # the pull request it merged (.github/actions/already-tested says when).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      skip: ${{ steps.tested.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions
      - id: tested
        uses: ./.github/actions/already-tested
        with:
          workflow: reproduce

  verify:
    runs-on: ubuntu-latest
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: harness/requirements.txt
      # `make verify` is `check` then `site-check`; here they run side by side (verify took 10.5 min on
      # 2026-11-04, 3 of them the site's build check), and the workflow is green only when both are.
      - name: make check (make verify without the site)
        run: make -C harness install && make -C harness check

  site:
    runs-on: ubuntu-latest
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: harness/requirements.txt
      - name: make site-check (the site matches a fresh build)
        run: make -C harness install && make -C harness site-check

  budget:
    runs-on: ubuntu-latest
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            harness/requirements.txt
            harness/requirements-browser.txt
      - name: harness environment
        run: make -C harness install
      - name: make budget-check
        run: make budget-check
      - name: Playwright and Chromium, cached
        uses: ./.github/actions/install-playwright
      - name: make browser-real-check (the pages, on the catalog budget-check built)
        run: make browser-real-check

  commands:
    runs-on: ubuntu-latest
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: harness/requirements.txt
      - name: harness environment
        run: make -C harness install
      - name: make commands-check
        run: make commands-check

  browser:
    runs-on: ubuntu-latest
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            harness/requirements.txt
            harness/requirements-browser.txt
      - name: harness environment
        run: make -C harness install
      - name: Playwright and Chromium (with the system libraries it needs), cached
        uses: ./.github/actions/install-playwright
      - name: make browser-check
        run: make browser-check
