# The code-quality gates, the same `make quality` a developer runs: ruff (lint and format),
# mypy, bandit and pip-audit, vulture, interrogate, codespell, shellcheck and actionlint, with
# radon's complexity report printed. Tools pinned in harness/requirements-dev.txt.
#
# No secrets, nothing paid: safe on pull requests from forks.
name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tested:
    # A push to main skips the jobs below when this workflow already passed on this exact tree, on
    # the pull request it merged (.github/actions/already-tested says when).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      skip: ${{ steps.tested.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions
      - id: tested
        uses: ./.github/actions/already-tested
        with:
          workflow: quality

  quality:
    runs-on: ubuntu-latest
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            harness/requirements.txt
            harness/requirements-dev.txt
      - name: harness environment and the quality tools
        run: make quality-install
      - name: make quality
        run: make quality
