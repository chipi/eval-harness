# Release the harness: push a tag `vX.Y.Z`, get a GitHub Release with the built package.
#
#   1. refuse the tag unless it equals harness/scripts/_version.py and CHANGELOG.md has a
#      section for it -- a release that disagrees with its own version is not a release;
#   2. refuse it unless CI on the tagged commit is green on main: reproduce and quality, and
#      guards when it ran (it runs only when the checkers change). The release does not
#      re-run them: a tag is made on a commit main has already verified;
#   3. build the wheel and sdist, install the wheel into a clean venv, and check the
#      installed `evh --version` is the tag;
#   4. create the GitHub Release, notes from the CHANGELOG section, package attached.
#
# GitHub Releases only, by decision: nothing is ever published to PyPI. The package is
# named evaluation-harness (command `evh`) because PyPI's `eval-harness` is an unrelated project.
# Consumers pin the tag:
#   evaluation-harness @ git+https://github.com/chipi/eval-harness@vX.Y.Z#subdirectory=harness
name: harness-release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: harness/requirements.txt

      - name: The tag, the version file and the changelog agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('harness/scripts/_version.py').read_text()).group(1))")
          test "$tag" = "$ver" || { echo "tag v$tag but harness/scripts/_version.py says $ver"; exit 1; }
          v_re="${ver//./\\.}"   # the exact version: 0.3.1 must not match 0.3.10
          grep -qxE "## $v_re( — .*)?" harness/CHANGELOG.md || { echo "harness/CHANGELOG.md has no '## $ver' section"; exit 1; }
          grep -qxE "## $v_re — [0-9]{4}-[0-9]{2}-[0-9]{2}" harness/CHANGELOG.md || {
            echo "harness/CHANGELOG.md does not date $ver ('## $ver — YYYY-MM-DD'); date it before tagging"; exit 1; }

      - name: CI on the tagged commit is green on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Waits while a run is still going (up to 40 minutes); a tag pushed right after the
          # merge finds main's CI on the commit still running.
          for _ in $(seq 80); do
            pending=0; bad=""
            all=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --event push --branch main \
              --limit 100 --json workflowName,status,conclusion \
              --jq '.[] | "\(.workflowName)\t\(.status) \(.conclusion)"')
            for wf in reproduce quality guards; do
              runs=$(printf '%s\n' "$all" | awk -F '\t' -v w="$wf" '$1 == w {print $2}')
              if [ -z "$runs" ]; then
                [ "$wf" = guards ] && continue   # path-filtered: no run when no checker changed
                bad="$bad $wf:no-run-on-main"; continue
              fi
              echo "$runs" | grep -qv '^completed' && { pending=1; continue; }
              echo "$runs" | grep -qx 'completed success' || bad="$bad $wf:$(echo "$runs" | head -1)"
            done
            [ -n "$bad" ] && { echo "CI on $GITHUB_SHA is not green on main:$bad"; exit 1; }
            [ "$pending" = 0 ] && { echo "CI on $GITHUB_SHA is green on main"; exit 0; }
            sleep 30
          done
          echo "CI on $GITHUB_SHA did not finish within 40 minutes"; exit 1

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build harness --outdir dist

      - name: The built wheel installs and reports this version
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          test "$(/tmp/clean/bin/evh --version)" = "${GITHUB_REF_NAME#v}"
          /tmp/clean/bin/evh --help > /dev/null

      - name: Release notes from the changelog
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="## $ver" '$0 == v || index($0, v " ")==1 {on=1; next} on && /^## / {exit} on' harness/CHANGELOG.md > notes.md
          {
            echo ""
            echo "### Install"
            echo '```'
            echo "pip install \"evaluation-harness @ git+https://github.com/chipi/eval-harness@${GITHUB_REF_NAME}#subdirectory=harness\""
            echo '```'
          } >> notes.md

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "evaluation-harness $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
