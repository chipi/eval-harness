# On every change to the harness: does it still build and install as a package?
#
# The release workflow only runs on a tag, which is too late to find out the package is
# broken. This builds the wheel, installs it into a clean venv, runs the installed CLI
# against a throwaway project outside the checkout, and checks the version has a
# CHANGELOG section -- so a release is a tag, not a repair.
name: harness-package

on:
  pull_request:
    paths: ["harness/**", ".github/workflows/harness-*.yml"]
  push:
    branches: [main]
    paths: ["harness/**", ".github/workflows/harness-*.yml"]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The oldest Python pyproject.toml allows, the one developed on, and the newest: the package
    # claims >=3.10, and only a run on 3.10 can show that is true.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build harness --outdir dist

      - name: Install into a clean venv and run outside the checkout
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          mkdir -p /tmp/proj/data/sources && cd /tmp/proj
          git init -q && git -c user.email=ci@ci -c user.name=ci commit -q --allow-empty -m init
          for n in 1 2 3; do echo "item $n" > data/sources/item_$n.txt; done
          /tmp/clean/bin/evh dataset-create --dataset-id ci_v1
          /tmp/clean/bin/evh validate
          # In a project, self-test checks the installed package: its paired-test suite and the
          # tutorial end to end (fields, runs, pair-test, rescore, validate, catalog).
          /tmp/clean/bin/evh self-test
          test -z "$(find /tmp/clean/lib -path '*site-packages/data' -maxdepth 4)"

      - name: The version has a CHANGELOG section
        run: |
          ver=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('harness/scripts/_version.py').read_text()).group(1))")
          grep -qxE "## ${ver//./\\.}( — .*)?" harness/CHANGELOG.md || { echo "harness/CHANGELOG.md has no '## $ver' section for version $ver"; exit 1; }
