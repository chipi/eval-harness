# The checks can fail: every checker, run once over a copy of the repository with all of its
# planted defects, must name each one (harness/tests/test_checks_can_fail.py, `make guard-check`).
#
# It proves the checkers' code, so it runs only when that code changes: the checkers
# (harness/tools/, harness/scripts/validate_tree.py), the harness package they import
# (harness/scripts/), the validation policy and schemas, or this test. A change to the reports,
# the runs or the docs is checked by `make verify` in reproduce.yml and does not need it.
#
# No secrets, nothing paid: safe on pull requests from forks.
name: guards

on:
  pull_request:
    paths:
      - harness/tools/**
      - harness/scripts/**
      - harness/schemas/**
      - harness/data/validate.json
      - harness/tests/test_checks_can_fail.py
      - .github/workflows/guards.yml
  push:
    branches: [main]
    paths:
      - harness/tools/**
      - harness/scripts/**
      - harness/schemas/**
      - harness/data/validate.json
      - harness/tests/test_checks_can_fail.py
      - .github/workflows/guards.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: harness/requirements.txt
      - name: make guard-check
        run: make guard-check
