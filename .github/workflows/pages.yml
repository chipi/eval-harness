# Publish the DOCUMENTATION (docs/ + harness/docs/ through mkdocs.yml) to GitHub Pages, at
# chipi.github.io/eval-harness. The same docs are also served from the prod VPS at
# evals.humancopilot.eu/docs (infra/deploy/render.sh builds them into each release; deploy-prod.yml
# ships it and crawls them). Both copies come from the same commit, and the Pages copy's canonical
# links name the website (mkdocs.yml site_url).
#
# Built in strict mode on every pull request too, so a broken link fails the PR's checks before
# the merge. A pull request only builds; a push to main, or a dispatch, publishes.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/mkdocs_hooks.py"
      - "site/analytics.json"
      - "site/requirements-docs.txt"
      - "docs/**"
      - "harness/docs/**"
      - "harness/CHANGELOG.md"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/mkdocs_hooks.py"
      - "site/analytics.json"
      - "site/requirements-docs.txt"
      - "docs/**"
      - "harness/CHANGELOG.md"
      - "harness/docs/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a pull request's check builds in its own group, so it can never
# cancel a deploy in progress.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements-docs.txt
      - name: Build the documentation
        run: |
          pip install -r site/requirements-docs.txt
          mkdocs build --strict
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r build/docs-site/. _site/
          # The footers say "build: local" (a commit cannot hold its own hash); the deployed
          # copy names the commit it was built from.
          sha="${GITHUB_SHA:?}"
          link="build: <a href=\"https://github.com/${GITHUB_REPOSITORY}/commit/${sha}\">${sha:0:7}</a>"
          grep -rlF --include='*.html' 'build: local' _site | xargs -r sed -i "s#build: local#${link}#g"
          n=$(grep -rlF --include='*.html' 'build: local' _site | wc -l)
          test "$n" -eq 0 || { echo "$n page(s) still say 'build: local'"; exit 1; }
          grep -rqF --include='*.html' "${sha:0:7}</a>" _site || { echo "no page names the commit"; exit 1; }
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # After the deploy: does Pages serve THIS commit's docs? The footer names the commit, so a
  # page that still names an older one means the publish did not land.
  published:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: The Pages copy names this commit
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          url="${PAGE_URL:-https://chipi.github.io/eval-harness/}"
          want="${GITHUB_SHA:0:7}</a>"
          for _ in $(seq 12); do
            page="$(curl -fsS "$url" || true)"
            grep -qF "$want" <<<"$page" && { echo "$url names ${GITHUB_SHA:0:7}"; break; }
            sleep 15
          done
          grep -qF "$want" <<<"$page" || { echo "::error::$url does not name ${GITHUB_SHA:0:7}"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' "${url%/}/sitemap.xml")"
          [ "$code" = 200 ] || { echo "::error::${url%/}/sitemap.xml returned $code"; exit 1; }
