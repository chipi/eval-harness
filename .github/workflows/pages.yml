# Publish the public site to GitHub Pages:
#
#   /        site/public      the findings site, generated from the runs by `make site`
#   /docs/   mkdocs.yml       the documentation (docs/ + harness/docs/), built here
#
# The findings site is built and committed, and `make ci` fails if it is stale, so this
# workflow only copies it; no corpora, weights or API keys are needed. The docs are built
# here in strict mode, so a broken link fails the deploy instead of shipping -- and on
# every pull request too, so it fails the PR's checks before the merge rather than the
# deploy after it. A pull request only builds; only a push to main deploys.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "harness/docs/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "harness/docs/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a pull request's check builds in its own group, so it can never
# cancel a deploy in progress.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements-docs.txt
      - name: Build the documentation
        run: |
          pip install -r site/requirements-docs.txt
          mkdocs build --strict
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/public/. _site/
          cp -r build/docs-site _site/docs
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # After the deploy: does the LIVE domain serve robots.txt and sitemap.xml at its root,
  # with the right types, and does every sitemap URL answer 200? (build.py --check proves
  # each URL is a built page; only the live domain can prove Pages publishes it.)
  crawl-check:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: robots.txt, sitemap.xml and every sitemap URL, on the live domain
        run: |
          site=https://evals.humancopilot.eu
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$site/sitemap.xml")
            [ "$code" = 200 ] && break; sleep 20
          done
          type_of() { curl -sI "$1" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}'; }
          rt=$(type_of "$site/robots.txt"); st=$(type_of "$site/sitemap.xml")
          echo "robots.txt  $rt"; echo "sitemap.xml $st"
          case "$rt" in text/plain*) ;; *) echo "robots.txt is not text/plain"; exit 1;; esac
          case "$st" in application/xml*|text/xml*) ;; *) echo "sitemap.xml is not XML"; exit 1;; esac
          curl -sf "$site/robots.txt" | grep -q "Sitemap: $site/sitemap.xml" || { echo "robots.txt does not point to the sitemap"; exit 1; }
          fail=0
          for u in $(curl -sf "$site/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g'); do
            c=$(curl -s -o /dev/null -w '%{http_code}' "$u"); echo "$c $u"
            [ "$c" = 200 ] || fail=1
          done
          exit $fail
