name: Deploy evals to prod VPS

# Renders a release (infra/deploy/render.sh: the harness site, the catalog built from the
# committed runs, the inspector's code and data), rsyncs it to /srv/evals/releases/<sha>/ on the
# prod VPS over the tailnet, and runs infra/deploy/deploy.sh there, which validates, switches the
# `current` symlink, health-checks every site and the inspector (rolling back on failure), and
# then installs our Alloy drop-in and Caddy vhosts with whole-set validation.
# Template: chipi/humancopilot.eu .github/workflows/deploy-prod.yml (the prod session's pattern).
#
# Environment `prod` (deployment branches: main only) holds:
#   secrets.PROD_SSH_PRIVATE_KEY   CI-only ed25519 key; public half in deploy@'s authorized_keys
#   secrets.TS_OAUTH_CLIENT_ID     Tailscale OAuth client (tag:gha-deployer)
#   secrets.TS_OAUTH_SECRET
#   vars.PROD_TAILNET_FQDN         MagicDNS name of the VPS; its domain part also names the tailnet's
#                                  VictoriaTraces node, so no tailnet name is committed
#   vars.PROD_SSH_HOST_KEY         the VPS's host key, pinned
#   secrets.EVALS_SENTRY_DSN_INSPECTOR  optional: the inspector's GlitchTip DSN (without it, no
#                                  error reporting; traces and /metrics still on)
# This repository is public: nothing here runs for a pull request, the job only runs on
# refs/heads/main, and the environment's branch rule keeps the secrets from any other ref.
#
# Rollback: "Re-run all jobs" on an older successful run (redeploys its sha); or `git revert` on
# main; or, to take a host off the edge, remove it from infra/caddy/enabled.txt and push.
# A failed deploy rolls itself back on the box (deploy.sh steps 3-4).

on:
  push:
    branches: [main]
    paths:
      # The site, its build hooks and analytics tag; the docs (built into the release by
      # render.sh and served from the VPS at /docs/), the changelog they include, and the
      # examples whose METRIC_DESCRIPTIONS the catalog's metric pages read.
      - "site/**"
      - "docs/**"
      - "harness/docs/**"
      - "harness/CHANGELOG.md"
      - "mkdocs.yml"
      - "examples/**"
      - "harness/scripts/**"
      # The inspector is the package, installed from its wheel (render.sh): what builds it.
      - "harness/pyproject.toml"
      - "harness/schemas/**"
      - "harness/tools/_wheel.py"
      - "harness/catalog_assets/**"
      - "harness/data/**"
      - "infra/**"
      - ".github/workflows/deploy-prod.yml"
      - ".github/actions/prod-ssh-key/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Upload and validate on the box (port preflight + nginx -t), then stop before switching anything
        type: boolean
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: prod
    # A push deploys only once the repository variable PROD_AUTO_DEPLOY is "true". It is unset
    # until the first deploy has been dispatched (a dry run, then a real one) and has passed, so
    # merging the branch that adds this workflow deploys nothing by itself (infra/README.md,
    # "Cutover"). A dispatch always runs.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch' || vars.PROD_AUTO_DEPLOY == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Pre-flight — required secrets and variables present
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_TAILNET_FQDN: ${{ vars.PROD_TAILNET_FQDN }}
          PROD_SSH_HOST_KEY: ${{ vars.PROD_SSH_HOST_KEY }}
        run: |
          missing=0
          for v in TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET PROD_SSH_PRIVATE_KEY PROD_TAILNET_FQDN PROD_SSH_HOST_KEY; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set in the prod environment"; missing=1; fi
          done
          exit $missing

      # NOTHING DEPLOYS BEFORE CI HAS PASSED ON THE SAME COMMIT. A push to main used to deploy at
      # once while reproduce was still running: c91d48b0 deployed at 11:01Z on 2026-10-27, its
      # verify failed at 11:32Z (a stale releases.html), and prod served it until the next deploy.
      # Same rule as harness-release.yml: reproduce, quality and guards completed and green, waiting
      # up to 40 minutes. A run cancelled by a newer push fails this deploy; the newer commit's own
      # deploy then runs after its CI.
      - name: CI on this commit is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 80); do
            pending=0; bad=""
            all=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --event push --branch main \
              --limit 100 --json workflowName,status,conclusion \
              --jq '.[] | "\(.workflowName)\t\(.status) \(.conclusion)"')
            for wf in reproduce quality guards; do
              runs=$(printf '%s\n' "$all" | awk -F '\t' -v w="$wf" '$1 == w {print $2}')
              if [ -z "$runs" ]; then
                bad="$bad $wf:no-run-on-main"; continue
              fi
              echo "$runs" | grep -qv '^completed' && { pending=1; continue; }
              echo "$runs" | grep -qx 'completed success' || bad="$bad $wf:$(echo "$runs" | head -1)"
            done
            [ -n "$bad" ] && { echo "::error::CI on $GITHUB_SHA is not green:$bad; nothing deployed"; exit 1; }
            [ "$pending" = 0 ] && { echo "CI on $GITHUB_SHA is green"; exit 0; }
            sleep 30
          done
          echo "::error::CI on $GITHUB_SHA did not finish within 40 minutes; nothing deployed"; exit 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Render the release
        run: |
          set -euo pipefail
          python -m pip install --quiet "pyyaml==6.0.2" -r site/requirements-docs.txt
          echo "SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          bash infra/deploy/render.sh _release "${GITHUB_SHA::12}"

      - name: Join the tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha-deployer
          # Pinned: `latest` has broken sha256 verification in GHA before (podcast_scraper RFC-082).
          version: 1.96.4

      - name: SSH identity with pinned host key
        uses: ./.github/actions/prod-ssh-key
        with:
          ssh_private_key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          pinned_host_key: ${{ vars.PROD_SSH_HOST_KEY }}

      - name: Upload the release
        env:
          TARGET: deploy@${{ vars.PROD_TAILNET_FQDN }}
        run: |
          set -euo pipefail
          # Hard-link every file the current release already has (most of the ~36,000 run
          # files never change), so only what changed crosses the tailnet.
          rsync -a --delete --mkpath --link-dest=/srv/evals/current/ \
            -e "ssh -i $SSH_PROD_IDENTITY -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            _release/ "$TARGET:/srv/evals/releases/$SHA/"

      # The inspector's observability settings, rendered from the environment on every deploy, as
      # podcast_scraper renders its .env (#841): nothing is committed and nothing is left on the box
      # by hand. Two keys only. Written in /dev/shm, copied to a staged file, moved into place (the
      # rename is atomic: /srv/evals is deploy's). Mode 640, deploy:deploy; the inspector reads it
      # through group_add 1001 (infra/compose.yml), so no other account on the box can. A dry run
      # changes nothing on the box, so it skips this.
      - name: Stage the inspector's observability settings
        if: ${{ !inputs.dry_run }}
        env:
          TARGET: deploy@${{ vars.PROD_TAILNET_FQDN }}
          PROD_TAILNET_FQDN: ${{ vars.PROD_TAILNET_FQDN }}
          SENTRY_DSN_INSPECTOR: ${{ secrets.EVALS_SENTRY_DSN_INSPECTOR }}
        run: |
          set -euo pipefail
          set +x
          domain="${PROD_TAILNET_FQDN#*.}"
          if [ -z "$domain" ] || [ "$domain" = "$PROD_TAILNET_FQDN" ]; then
            echo "::error::cannot build the traces endpoint: PROD_TAILNET_FQDN has no domain part"
            exit 1
          fi
          case "$SENTRY_DSN_INSPECTOR" in
            *$'\n'* | *$'\r'*) echo "::error::EVALS_SENTRY_DSN_INSPECTOR holds a line break"; exit 1 ;;
          esac
          tmp="$(mktemp -p /dev/shm evals-obs.XXXXXX)"
          trap 'shred -u "$tmp" 2>/dev/null || rm -f "$tmp"' EXIT
          chmod 600 "$tmp"
          {
            if [ -n "$SENTRY_DSN_INSPECTOR" ]; then
              printf '%s=%s\n' SENTRY_DSN "$SENTRY_DSN_INSPECTOR"
            fi
            printf '%s=%s\n' OTEL_EXPORTER_OTLP_TRACES_ENDPOINT "https://vtraces.${domain}/insert/opentelemetry/v1/traces"
          } > "$tmp"
          [ -n "$SENTRY_DSN_INSPECTOR" ] \
            || echo "::warning::EVALS_SENTRY_DSN_INSPECTOR is not set: the inspector reports no errors to GlitchTip"
          opts=(-i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes)
          # Born 640 (umask 027), never readable by others even for a moment: scp would create it with
          # deploy's default mode and chmod it after.
          ssh "${opts[@]}" "$TARGET" 'umask 027 && cat > /srv/evals/.observability.env.staged' < "$tmp"
          # The check prints the mode, the owner and the key names, never a value; it fails when the
          # file's group is not the one infra/compose.yml's group_add names (1001), or the inspector
          # would silently lose its settings.
          ssh "${opts[@]}" "$TARGET" 'set -eu
            mv -f /srv/evals/.observability.env.staged /srv/evals/observability.env
            stat -c "observability.env: %a %U:%G" /srv/evals/observability.env
            echo "keys: $(cut -d= -f1 /srv/evals/observability.env | tr "\n" " ")"
            [ "$(stat -c %a /srv/evals/observability.env)" = 640 ] || { echo "::error::observability.env is not mode 640"; exit 1; }
            [ "$(stat -c %g /srv/evals/observability.env)" = 1001 ] \
              || { echo "::error::observability.env gid is not 1001 (group_add in infra/compose.yml)"; exit 1; }'

      - name: Activate on the VPS
        env:
          TARGET: deploy@${{ vars.PROD_TAILNET_FQDN }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          ssh -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$TARGET" "DRY_RUN=$DRY_RUN bash /srv/evals/releases/$SHA/deploy/deploy.sh"

      - name: Public probe (only for vhosts enabled on the edge)
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          enabled="$(grep -vE '^\s*(#|$)' infra/caddy/enabled.txt | tr -d ' \t' || true)"
          probe() {  # url, text that only this release's page contains
            for _ in 1 2 3 4 5 6; do
              code="$(curl -s -o /dev/null -w '%{http_code}' "$1")" && [ "$code" = 200 ] && break
              sleep 10
            done
            [ "$code" = 200 ] || { echo "::error::$1 returned $code"; exit 1; }
            # Read the page whole, then search it: `curl | grep -q` under pipefail fails on a match
            # (grep closes the pipe early, curl exits 23).
            page="$(curl -fsS "$1")"
            grep -qF "$2" <<<"$page" || { echo "::error::$1 is not this release"; exit 1; }
            echo "public $1 OK"
          }
          if grep -qx evals <<<"$enabled"; then
            probe https://evals.humancopilot.eu/ "?v=$SHA"
            probe https://evals.humancopilot.eu/catalog/ "?v=$SHA"
            probe https://evals.humancopilot.eu/docs/ "?v=$SHA"
            health="$(curl -fsS https://evals.humancopilot.eu/catalog/api/health)"
            grep -qF '"ok": true' <<<"$health" \
              || { echo "::error::the inspector API does not answer on the public host"; exit 1; }
          fi
          [ -n "$enabled" ] || echo "no vhost enabled yet; the on-box loopback health check is the gate"
