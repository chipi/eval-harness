# Levels 1-2 of docs/REPRODUCE.md for the arms that need no key and no PyTorch: fetch the public data,
# hash-check it against the frozen datasets, rerun the deterministic arms, and require the replication card
# to say they match the committed runs exactly. A change that breaks a fetcher, a scorer, the data upstream
# or the reproduce tooling turns this red before a stranger finds it.
#
# Its own workflow, not reproduce's: it fetches from the Hugging Face datasets-server, and an outage there
# (HTTP 503 on /rows for every dataset, 2026-11-02) held back a deploy and a release, which wait on
# reproduce, quality and guards. It still runs on every change and reports. The fetched data is cached,
# keyed on the frozen datasets and the fetchers, so most runs make no call to Hugging Face at all; a stale
# or corrupt cache cannot pass, since materialize checks every item's sha256.
#
# No secrets: nothing here calls a paid model, so it is safe on pull requests from forks.
name: rerun

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rerun-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tested:
    # A push to main skips the jobs below when this workflow already passed on this exact tree, on
    # the pull request it merged (.github/actions/already-tested says when).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      skip: ${{ steps.tested.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions
      - id: tested
        uses: ./.github/actions/already-tested
        with:
          workflow: rerun

  rerun:
    runs-on: ubuntu-latest
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - exp: summarization
            arms: lead3
          - exp: ag-news
            arms: keyword,constant
          - exp: scifact
            arms: bm25,random,first_k
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: harness/requirements.txt
      - uses: astral-sh/setup-uv@v7
      - name: harness environment
        run: make setup
      - name: the public data, cached (every item is hash-checked against the frozen dataset when materialized)
        uses: actions/cache@v6
        with:
          # The fetched slices and corpora only (gitignored): the committed demo items in data/sources stay
          # out, so a restore never writes over a tracked file.
          path: |
            harness/data/sources
            !harness/data/sources/item_*.txt
            !harness/data/sources/README.md
            harness/data/corpora
          key: rerun-data-${{ matrix.exp }}-${{ hashFiles('harness/data/datasets/**', 'examples/*/fetch.py', 'examples/_shared/hf_rows.py') }}
      - name: data (fetch + hash check)
        run: harness/.venv/bin/python examples/reproduce.py data ${{ matrix.exp }} --light
      - name: rerun
        run: harness/.venv/bin/python examples/reproduce.py run ${{ matrix.exp }} --arms ${{ matrix.arms }}
      - name: replication card
        run: |
          harness/.venv/bin/python examples/reproduce.py compare ${{ matrix.exp }} | tee card.md
          ! grep -E '\| (within noise|consistent|DIFFERS|PARTIAL)' card.md
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: replication-${{ matrix.exp }}
          path: harness/data/runs-repro/${{ matrix.exp }}/REPLICATION.md
