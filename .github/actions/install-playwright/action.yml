name: Install Playwright Chromium (cached)
description: |
  Installs Playwright's Chromium and its system libraries from GitHub's Actions cache; only on a
  miss from Playwright's CDN and the Ubuntu mirror. Run it after `make -C harness install`.

  Why: `playwright install --with-deps` runs apt against the runner's Ubuntu mirror for the
  browser's system libraries. On 2026-10-27 that took `Fetched 25.9 MB in 9min 22s (46.1 kB/s)`
  in the browser job, while the browser itself came from the CDN in ~7 s and the test ran in 8 s.
  The same pattern as chipi/podcast_scraper's install-playwright action, for the Python package.

  How: the browser directory (~/.cache/ms-playwright) and the .deb files that install-deps
  downloads are cached under the runner image (`ImageOS`, `ImageVersion`) and the installed
  Playwright version, so the browser build and the libraries always match. On a hit nothing is
  fetched: the cached packages are installed, and `install-deps` (which goes to the mirror) runs
  only if the browser's binaries still miss a shared library (`ldd`). If installing the cached
  files fails, the step installs afresh. Keys are `<base>-<run id>`, restored by the `<base>-`
  prefix, so the newest entry wins and a fallback replaces a bad one; a healthy hit saves nothing.

runs:
  using: composite
  steps:
    - name: Playwright into the harness environment
      shell: bash
      run: harness/.venv/bin/pip install -q -r harness/requirements-browser.txt

    - name: Playwright cache key
      id: key
      shell: bash
      run: |
        set -euo pipefail
        version=$(harness/.venv/bin/python -m playwright --version | awk '{print $2}')
        base="playwright-v1-${ImageOS:-unknown}-${ImageVersion:-unknown}-chromium-deps-${version}"
        echo "debs=${RUNNER_TEMP}/apt-playwright-chromium" >> "$GITHUB_OUTPUT"
        echo "base=${base}" >> "$GITHUB_OUTPUT"
        echo "key=${base}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

    - name: Restore Playwright browser
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cache/ms-playwright
          ${{ steps.key.outputs.debs }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.base }}-

    - name: Install Playwright browser
      id: install
      shell: bash
      env:
        DEB_DIR: ${{ steps.key.outputs.debs }}
        RESTORED: ${{ steps.restore.outputs.cache-matched-key }}
      run: |
        set -euo pipefail
        pw() { harness/.venv/bin/python -m playwright "$@"; }
        missing_libs() {
          # Shared libraries the browser's own binaries cannot resolve on this machine.
          find -L ~/.cache/ms-playwright -type f \( -name chrome -o -name chrome-headless-shell \
              -o -name headless_shell -o -name 'lib*.so' \) -print0 2>/dev/null \
            | xargs -0 -r ldd 2>/dev/null | grep -c "not found" || true
        }
        fresh() {
          # apt keeps downloads by default, but some apt configs delete them; the cache needs them.
          printf 'APT::Keep-Downloaded-Packages "true";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\n' \
            | sudo tee /etc/apt/apt.conf.d/99keep-downloaded-packages >/dev/null
          # Keep only the .deb files install-deps downloads now, not ones already on disk.
          before=$(mktemp)
          { ls /var/cache/apt/archives/*.deb 2>/dev/null || true; } | sort > "$before"
          pw install --with-deps chromium
          rm -rf "$DEB_DIR" && mkdir -p "$DEB_DIR"
          { ls /var/cache/apt/archives/*.deb 2>/dev/null || true; } | sort | comm -13 "$before" - \
            | xargs -r -I{} cp {} "$DEB_DIR"/
          ls "$DEB_DIR"/*.deb >/dev/null 2>&1 || echo "playwright: no new system packages captured"
          echo "save=true" >> "$GITHUB_OUTPUT"
        }
        if [ -n "${RESTORED}" ]; then
          ok=true
          if ls "$DEB_DIR"/*.deb >/dev/null 2>&1; then
            echo "playwright: installing $(ls "$DEB_DIR"/*.deb | wc -l) cached system packages (${RESTORED})"
            sudo dpkg -i "$DEB_DIR"/*.deb || ok=false
          fi
          # A no-op when the cached browser is complete; downloads what is missing otherwise.
          pw install chromium || ok=false
          if [ "$ok" = "true" ] && [ "$(missing_libs)" != "0" ]; then
            echo "playwright: the browser still misses shared libraries; running install-deps"
            pw install-deps chromium || ok=false
          fi
          if [ "$ok" = "true" ]; then
            echo "save=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::playwright: the cached files (${RESTORED}) did not install; installing afresh"
            sudo apt-get -f install -y || true
            fresh
          fi
        else
          echo "playwright: cache miss; installing once for this runner image and version"
          fresh
        fi

    - name: Save Playwright browser
      if: steps.install.outputs.save == 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ~/.cache/ms-playwright
          ${{ steps.key.outputs.debs }}
        key: ${{ steps.key.outputs.key }}
