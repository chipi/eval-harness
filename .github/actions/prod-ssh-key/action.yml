name: Prod deploy SSH identity
description: |
  Writes the CI SSH private key to a runner-local file, exports its path (SSH_PROD_IDENTITY),
  and pins the prod VPS host key: ssh refuses any prod-podcast* host whose key differs
  (StrictHostKeyChecking yes, keyed by HostKeyAlias so a prod-podcast-N rename still matches).
  Copied from chipi/podcast_scraper .github/actions/prod-ssh-key (the prod session's required
  pattern); the "unpinned" drill mode is dropped because this repo only deploys to prod.

inputs:
  ssh_private_key:
    description: Full PEM contents of the CI-only key trusted by deploy@ on the VPS.
    required: true
  pinned_host_key:
    description: Public host key of the VPS ("ssh-ed25519 AAAA…", no hostname), vars.PROD_SSH_HOST_KEY.
    required: true

runs:
  using: composite
  steps:
    - name: Write PEM to isolated file and pin the host key
      shell: bash
      env:
        KEY_MATERIAL: ${{ inputs.ssh_private_key }}
        PINNED_HOST_KEY: ${{ inputs.pinned_host_key }}
      run: |
        set -euo pipefail
        if [ -z "${KEY_MATERIAL}" ]; then
          echo "::error::prod-ssh-key: ssh_private_key input is empty"
          exit 1
        fi
        if [[ ! "${PINNED_HOST_KEY}" =~ ^(ssh-ed25519|ecdsa-sha2-nistp256|ssh-rsa)\ [A-Za-z0-9+/]+={0,2}$ ]]; then
          echo "::error::prod-ssh-key: pinned_host_key must be 'ssh-ed25519 AAAA…' (vars.PROD_SSH_HOST_KEY)"
          exit 1
        fi
        key_file="${RUNNER_TEMP}/gha_deploy_ssh_ed25519"
        printenv KEY_MATERIAL > "$key_file"
        chmod 600 "$key_file"
        echo "SSH_PROD_IDENTITY=${key_file}" >> "${GITHUB_ENV}"
        mkdir -p "${HOME}/.ssh"
        chmod 700 "${HOME}/.ssh"
        printf 'pinned-prod-podcast %s\n' "${PINNED_HOST_KEY}" > "${HOME}/.ssh/known_hosts_pinned_prod"
        cat >> "${HOME}/.ssh/config" <<CFG
        Host prod-podcast prod-podcast.* prod-podcast-*
          HostKeyAlias pinned-prod-podcast
          UserKnownHostsFile ${HOME}/.ssh/known_hosts_pinned_prod
          StrictHostKeyChecking yes
        CFG
        chmod 600 "${HOME}/.ssh/config"
