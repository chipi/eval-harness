<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workbench mockup (frozen)</title>
<link rel="stylesheet" href="../workbench.css">
</head>
<body>
  <a class="skip" href="#main">Skip to the screen</a>
<div class="mockbar" role="note">
  <span><b>Mockup, round 5</b> · static: the data is read from this project, nothing is saved to it</span>
  <span class="grow"></span>
  <label class="toggle"><input type="checkbox" id="mocknotes" checked> mockup notes</label>
  <button type="button" id="reset">start over</button>
</div>
<!-- the live Workbench's bar (index.html): the screens on its second row, hints and the theme behind the ☰ on a phone -->
<header class="bar"><div class="wrap">
  <a class="brand" href="#start"><img class="mark" src="../icon.svg" alt="" width="28" height="28"><span>evh workbench</span></a>
  <div class="tools" id="tools">
    <label class="toggle"><input type="checkbox" id="hints" checked> hints</label>
    <button type="button" class="menu-theme" data-theme-toggle>Light or dark</button>
  </div>
  <button type="button" class="hbtn theme" id="theme" aria-label="Toggle light and dark"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
  <button type="button" class="hbtn menubtn" id="menubtn" aria-expanded="false" aria-controls="tools" aria-label="Menu"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</div><div class="onpage"><nav class="wrap" id="nav" aria-label="The Workbench's screens">
  <a href="#home">Home</a>
  <a href="#model-new">Models</a>
  <a href="#jobs">Jobs</a>
  <a href="#settings">Settings</a>
  <a href="#glossary">Words</a>
  <a href="#catalog">Catalog ↗</a>
</nav></div></header>
<div class="layout" id="layout">
  <aside class="rail" id="rail" aria-label="The goal's steps"></aside>
  <main id="main" tabindex="-1"></main>
  <aside class="help" id="help" hidden aria-label="Help"></aside>
</div>
<script src="mock.js"></script>
<script src="../help.js"></script>
<script src="../workbench.js"></script>
<script src="workflows.js"></script>
<script src="round5.js"></script>
</body>
</html>
