conclusion:
  text: 'Onboarding was the fix round 1 needed, not a winner. The 25 arms re-run with their model records''
    settings (reasoning off, or low where a model cannot stop; a reply cap; gpt-oss on Ollama read through
    reply_in_tool_call) all answered, none deferred. On the combined cost the paired test still finds
    no arm significantly different from the leader, the vLLM qwen3-30b-a3b on the DGX (0.400), except
    two significantly worse after Holm: llama4_scout and qwen3.5:122b on the DGX; 50 are not significantly
    different. The false-alarm limit (no worse than production, each arm on its own) rules out the arm
    that always escalates, Nemotron 3.5 Lightning v2 on all three machines, and llama4_scout. Production''s
    model with reasoning off raises fewer false alarms than production (significant at 0.05) and misses
    more real problems (not significant); on the combined cost it is not significantly different from
    production (+0.37). Nothing is promoted: 65 decisions cannot tell this field apart (a power estimate
    put it at about 135-175 independent decisions). The next step is more labelled decisions, not more
    arms.'
  promoted_run: null
