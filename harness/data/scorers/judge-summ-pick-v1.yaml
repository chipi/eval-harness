# The summarisation eval judged in pick mode (docs/rfc/RFC-005-judge-scorers.md "Judging modes"): judge-summ-v1's
# two judges, each validated in pick mode on SummEval as an arm (examples/summeval-judging/configs/
# arm_{gemma_l,qwen_s}_pick_n100.yaml, 2026-11-02). min_metric is the random floor's top1 (se_random_n100_pick_v1_20261102T141456Z):
# a judge no better than chance is refused. The gate reads each named run's top1 and its settings.
scorer_id: judge-summ-pick-v1
kind: judge
mode: pick
dataset_id: cnn_dailymail_200
judges:
  - id: gemma_l
    params:
      provider: litellm
      model: eval-gemma-31b
      family: gemma
      price_tier: large
      temperature: 0.0
      reasoning: {enabled: false}
      usd_per_mtok_in: 0.1
      usd_per_mtok_out: 0.2
      max_tokens: 1500
  - id: qwen_s
    params:
      provider: litellm
      model: eval-qwen-flash
      family: qwen
      price_tier: small
      temperature: 0.0
      reasoning: {enabled: false}
      usd_per_mtok_in: 0.05
      usd_per_mtok_out: 0.2
      max_tokens: 1500
prompt:
  file: examples/summeval-judging/prompt_pick.txt
  sha256_at_16: 7f2becef44aae979433c02983916f81234e54bef10eab7a4c606c2574c7042b7
protocol:
  outputs_per_call: 29
  blinding: true
  order_seed: 0
  position_check_fraction: 0.1
  noise_check_fraction: 0.1
validation:
  mode: pick
  dataset_id: summeval_100
  metric: top1
  what: share of the 100 articles whose pick is among the summaries the three experts rate best (their mean over 4 dimensions)
  differs_from_this_use: >-
    SummEval's 16 summaries are from systems of 2019; here a call shows all 29 modern arms' summaries of one article at once, which no validation measured.
  runs:
    - {judge: gemma_l, run: se_gemma_l_n100_pick_v1_20261102T151040Z, value: 0.364167, min_metric: 0.07}
    - {judge: qwen_s, run: se_qwen_s_n100_pick_v1_20261102T151347Z, value: 0.263333, min_metric: 0.07}
cost_cap_usd: 1.00
