# The summarisation eval judged in pairwise mode (docs/rfc/RFC-005-judge-scorers.md "Judging modes"): judge-summ-v1's
# two judges, each validated in pairwise mode on SummEval as an arm (examples/summeval-judging/configs/
# arm_{gemma_l,qwen_s}_pairwise_n100.yaml, 2026-11-02). min_metric is the random floor's pair_agreement (se_random_n100_pairwise_v1_20261102T141457Z):
# a judge no better than chance is refused. The gate reads each named run's pair_agreement and its settings.
scorer_id: judge-summ-pairwise-v1
kind: judge
mode: pairwise
dataset_id: cnn_dailymail_200
judges:
  - id: gemma_l
    params:
      provider: litellm
      model: eval-gemma-31b
      family: gemma
      price_tier: large
      temperature: 0.0
      reasoning: {enabled: false}
      usd_per_mtok_in: 0.1
      usd_per_mtok_out: 0.2
      max_tokens: 1500
  - id: qwen_s
    params:
      provider: litellm
      model: eval-qwen-flash
      family: qwen
      price_tier: small
      temperature: 0.0
      reasoning: {enabled: false}
      usd_per_mtok_in: 0.05
      usd_per_mtok_out: 0.2
      max_tokens: 1500
prompt:
  file: examples/summeval-judging/prompt_pairwise.txt
  sha256_at_16: e21c4f6b2549953801ec742b4fa39d0dabcdf4eae6e9fa2c7eae82409703ca22
protocol:
  outputs_per_call: 2
  blinding: true
  order_seed: 0
  position_check_fraction: 0.1
  noise_check_fraction: 0.1
validation:
  mode: pairwise
  dataset_id: summeval_100
  metric: pair_agreement
  what: share of 8 seeded pairs an article (those the experts rank apart) where the judge prefers the summary the experts rate higher, a tie counting a half
  differs_from_this_use: >-
    SummEval's summaries are from systems of 2019; here the pairs are modern arms' summaries, every pair of the arms judged on every item.
  runs:
    - {judge: gemma_l, run: se_gemma_l_n100_pairwise_v1_20261102T151620Z, value: 0.824613, min_metric: 0.472845}
    - {judge: qwen_s, run: se_qwen_s_n100_pairwise_v1_20261102T152804Z, value: 0.8125, min_metric: 0.472845}
cost_cap_usd: 10.00
