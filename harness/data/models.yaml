# What each model's weights are, for the arms page's open / proprietary filter (`evh arms
# --weights`): open (downloadable) or proprietary (served only by its vendor), and the licence
# where it is known. Keyed by the model a run records (params.model). A model not listed here
# shows as unknown. The hosted aliases follow docs/REFERENCE.md's hosted table (checked by
# tools/check_model_facts.py); the local models downloaded their weights from HuggingFace.
