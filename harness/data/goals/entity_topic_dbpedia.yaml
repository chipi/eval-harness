goal_id: entity_topic_dbpedia
schema_version: "0.1"
title: Encyclopedia topic classification (DBpedia)
statement: Pick a classifier that labels an encyclopedia abstract with one of fourteen classes, at a known cost per item.
status: active
context:
  audience: a pipeline that files encyclopedia entries by class
decision: Which classifiers can be told apart on accuracy across many classes, and at what cost.
output_contract:
  - {id: label, format: label}
success_criteria:
  primary: {measure: correct, direction: higher}
  strategy: frugal
  guardrails:
    - {"name": "licence", "rule": "DBpedia-14 is CC-BY-SA 3.0 + GFDL, inherited from Wikipedia: anything redistributed that contains its text is share-alike.", "source": "docs/DATA.md"}
    - {"name": "not shown is not ruled out", "rule": "At 280 items no gap under 10 items was separated: a gain of up to about 3 points from paying more is not ruled out, only not shown.", "source": "research/REPORT_CLASSIFICATION.md, executive summary"}
datasets:
  - {dataset_id: dbpedia_280, role: heldout, notes: 20 per class, seeded}
  - {dataset_id: dbpedia_56, decides: false, role: dev, notes: the pilot slice; all 56 of its items are in dbpedia_280}
measures:
  - {id: correct, kind: metric, validity: validated}
