# evaluation-harness as an installable package, so a project can PIN it instead of copying it:
#
#     pip install "evaluation-harness @ git+https://github.com/chipi/eval-harness@<commit>#subdirectory=harness"
#
# The package is the harness core: scripts/ installs as `evaluation_harness`, schemas/ beside
# it. The data is never in the package -- it lives in the project that uses it (see
# EVAL_HOME / EVAL_DATA_DIR in scripts/cli.py). A checkout keeps working exactly as
# before: `make <target>` runs the same scripts the `evh` command does.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
# Named evaluation-harness, never `eval-harness`: on PyPI that name, and its import
# `eval_harness`, belong to an unrelated project. Nothing of ours is on PyPI; install only
# from GitHub. The command is `evh`.
name = "evaluation-harness"
dynamic = ["version"]
description = "Is the ranking real, or a lucky sample? Frozen datasets, run fingerprints, paired significance tests."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
# The bundled template adapter and judges call hosted models through these clients.
llm = ["openai>=1.0", "anthropic>=0.40"]
# The self-test's summarisation corpus checks.
test = ["rouge-score"]

[project.scripts]
evh = "evaluation_harness.cli:main"

[project.urls]
Homepage = "https://chipi.github.io/eval-harness/"
Source = "https://github.com/chipi/eval-harness"

[tool.setuptools]
packages = ["evaluation_harness", "evaluation_harness.schemas", "evaluation_harness.catalog_assets"]
package-dir = {"evaluation_harness" = "scripts", "evaluation_harness.schemas" = "schemas", "evaluation_harness.catalog_assets" = "catalog_assets"}

[tool.setuptools.package-data]
"evaluation_harness.schemas" = ["*.json"]
"evaluation_harness.catalog_assets" = ["*.css", "*.js", "*.svg"]

[tool.setuptools.dynamic]
version = {attr = "evaluation_harness._version.__version__"}
