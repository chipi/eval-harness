# evaluation-harness as an installable package, so a project can PIN it instead of copying it:
#
#     pip install "evaluation-harness @ git+https://github.com/chipi/eval-harness@<commit>#subdirectory=harness"
#
# The package is the harness core: scripts/ installs as `evaluation_harness`, schemas/ beside
# it. The data is never in the package -- it lives in the project that uses it (see
# EVAL_HOME / EVAL_DATA_DIR in scripts/cli.py). A checkout keeps working exactly as
# before: `make <target>` runs the same scripts the `evh` command does.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
# Named evaluation-harness, never `eval-harness`: on PyPI that name, and its import
# `eval_harness`, belong to an unrelated project. Nothing of ours is on PyPI; install only
# from GitHub. The command is `evh`.
name = "evaluation-harness"
dynamic = ["version"]
description = "Is the ranking real, or a lucky sample? Frozen datasets, run fingerprints, paired significance tests."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
# Everything works from one install: the bundled adapter's hosted providers and the LLM judges
# call models through openai (any OpenAI-compatible endpoint: OpenAI, OpenRouter, a LiteLLM
# proxy) and anthropic. They were an extra, `[llm]`, that only one RUNBOOK section named; a
# newcomer's first hosted arm failed on the import.
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "openai>=1.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# The self-test's summarisation corpus checks.
test = ["rouge-score"]

[project.scripts]
evh = "evaluation_harness.cli:main"

[project.urls]
Homepage = "https://evals.humancopilot.eu/"
Source = "https://github.com/chipi/eval-harness"

[tool.setuptools]
packages = ["evaluation_harness", "evaluation_harness.schemas", "evaluation_harness.catalog_assets", "evaluation_harness.tutorial"]
package-dir = {"evaluation_harness" = "scripts", "evaluation_harness.schemas" = "schemas", "evaluation_harness.catalog_assets" = "catalog_assets", "evaluation_harness.tutorial" = "tutorial"}

[tool.setuptools.package-data]
"evaluation_harness.schemas" = ["*.json"]
"evaluation_harness.catalog_assets" = ["*.css", "*.js", "*.svg"]
# The GUIDE's kit: `evh init --tutorial` copies it into a new project.
"evaluation_harness.tutorial" = ["*.md", "*.txt", "*.csv", "judge_panel.yaml", "tickets/*.txt", "gold/*.txt", "configs/*.yaml", "goals/*.yaml", "fields/*.yaml", "scorers/*.yaml"]

[tool.setuptools.dynamic]
version = {attr = "evaluation_harness._version.__version__"}

[tool.mypy]
# 3.10, not the package's 3.9 floor: mypy 2.x no longer type-checks for 3.9. The 3.9 floor is
# held by CI's package job, which installs the wheel on 3.9 and runs `evh self-test`.
python_version = "3.10"
# The modules import each other as the package (`from evaluation_harness._common import …`);
# in a checkout harness/evaluation_harness is a link to scripts/, so it is checked once, by that
# name. tests/ and tools/ are this repository's tests and report checks: not in the package,
# checked the same.
mypy_path = ".,tests,tools"
explicit_package_bases = true
files = ["evaluation_harness", "tests", "tools"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.interrogate]
# podcast_scraper's exemptions and its bar: every public function, class and method has one.
ignore-init-module = true
ignore-init-method = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
ignore-property-decorators = true
ignore-module = true
ignore-nested-functions = true
exclude = ["scripts/test_*.py", "tests/test_*.py", "tests/self_test.py"]
fail-under = 100
