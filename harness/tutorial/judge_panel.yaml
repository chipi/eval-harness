# The judge panel over the tutorial's runs (docs/GUIDE.md): promote the best arms on their
# primary metric, judge each one's stored outputs, flag where two judges disagree.
#
#   evh judge --config tutorial/judge_panel.yaml --use-fake-judge   # no API key
#   evh judge --config tutorial/judge_panel.yaml                    # Claude, billed and capped

# Outputs: <project>/<output_root>/<tag>/ (report.md, report.json, finalists.jsonl).
output_root: out/judge-panel
tag: tickets

# The candidates: the tutorial's runs on tickets_v1, ranked by the primary metric they record.
runs_from: runs
dataset_id: tickets_v1

promotion:
  per_stratum_top_k: 3          # top-K within each stratum (a stratum is a config_id)
  floor_fraction: 0.80          # drop if score < floor_fraction * stratum_leader
  overall_cap: 6                # absolute ceiling after stratum trimming
  carte_blanche: []             # config_ids judged whatever the cheap metric says

judging:
  primary_judge: claude-sonnet-4-6
  cross_judge: null             # a second judge, for the disagreement flag
  cost_cap_usd: 1.0             # hard mid-run abort
  max_items_per_finalist: 6
  dimensions: [accuracy, completeness, clarity]

aggregation:
  contested_threshold: 0.5      # on the 1-5 scale; > 0.5 between judges = contested
  agreement_tolerance: 1        # exact-or-adjacent within +-N counts as agreement
