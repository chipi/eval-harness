<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <!-- 06 · A catalog to look around in: a library card-catalog cabinet stands on the through-line;
       one drawer is pulled open, its index cards marked with the logo's brackets; on top of the
       cabinet, a row of the ice cubes from 01 (the frozen datasets). A magnifying glass leans
       against the open drawer: the inspector. Through-line at half height. -->
  <rect width="1536" height="1024" fill="#f6f5f1"/>
  <path d="M0 512H1536" stroke="#0b0b0b" stroke-width="7" stroke-linecap="round"/>
  <!-- the cabinet -->
  <rect x="560" y="250" width="420" height="262" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="7"/>
  <g fill="none" stroke="#0b0b0b" stroke-width="5">
    <rect x="590" y="276" width="170" height="90"/><rect x="780" y="276" width="170" height="90"/>
    <rect x="590" y="396" width="170" height="90"/>
  </g>
  <g fill="#0b0b0b"><circle cx="675" cy="321" r="8"/><circle cx="865" cy="321" r="8"/><circle cx="675" cy="441" r="8"/></g>
  <!-- the drawer pulled open, its cards in the green wash -->
  <path d="M780 396H950L1010 446H840Z" fill="#8db14b" opacity="0.45" stroke="#0b0b0b" stroke-width="5" stroke-linejoin="round"/>
  <rect x="840" y="446" width="170" height="60" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="5"/>
  <g fill="#fcfcfb" stroke="#0b0b0b" stroke-width="4">
    <rect x="812" y="370" width="120" height="60" rx="4"/><rect x="834" y="362" width="120" height="60" rx="4"/><rect x="856" y="354" width="120" height="60" rx="4"/>
  </g>
  <g fill="none" stroke="#0b0b0b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M880 368H870V392H880"/><path d="M952 368H962V392H952"/>
  </g>
  <!-- the ice cubes on top: the frozen datasets -->
  <g fill="#eef1f2" stroke="#0b0b0b" stroke-width="4" stroke-linejoin="round">
    <rect x="590" y="190" width="60" height="60"/><rect x="680" y="190" width="60" height="60"/>
    <rect x="770" y="190" width="60" height="60"/><rect x="860" y="190" width="60" height="60"/>
  </g>
  <!-- the inspector: a magnifying glass against the drawer -->
  <circle cx="1110" cy="400" r="54" fill="none" stroke="#0b0b0b" stroke-width="8"/>
  <path d="M1146 440L1196 506" stroke="#0b0b0b" stroke-width="14" stroke-linecap="round"/>
</svg>
